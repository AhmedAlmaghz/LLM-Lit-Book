<text x="546" y="200" font-family="'Segoe UI', 'Cairo', 'Tahoma', 'Noto Naskh Arabic', sans-serif" font-size="12.3" font-weight="400" text-anchor="start" fill="#334155" opacity="1" dir="rtl" dominant-baseline="middle">• ابدأ دائمًا بـ INT8/FP8 ثم قِس</text>
<text x="546" y="230" font-family="'Segoe UI', 'Cairo', 'Tahoma', 'Noto Naskh Arabic', sans-serif" font-size="12.3" font-weight="400" text-anchor="start" fill="#334155" opacity="1" dir="rtl" dominant-baseline="middle">• التكميم العدواني يُفقِد مهارات التفكير في النماذج الصغيرة</text>
