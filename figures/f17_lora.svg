<text x="132" y="182" font-family="Consolas, 'Cascadia Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" fill="#64748B" opacity="1" dir="rtl" dominant-baseline="middle">W: d×k — مليارات؛ مثبّتة لا تدرّب</text>
