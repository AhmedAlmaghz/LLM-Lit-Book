<text x="81.8" y="452.6" font-family="'Segoe UI', 'Cairo', 'Tahoma', 'Noto Naskh Arabic', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#0891B2" opacity="1" dominant-baseline="middle">peft</text>
<text x="138" y="450" font-family="Consolas, 'Cascadia Mono', 'Liberation Mono', monospace" font-size="12.5" font-weight="400" text-anchor="start" fill="#1E293B" opacity="1" dir="rtl" dominant-baseline="middle">PEFT API — سطران للتدريب:</text>
