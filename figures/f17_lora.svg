<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" font-family="'Segoe UI', 'Cairo', 'Tahoma', 'Noto Naskh Arabic', sans-serif" direction="ltr">
<defs><marker id="agrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect x="0" y="0" width="1040" height="540" fill="#FFFFFF"/>
<text x="520.0" y="34" font-family="'Segoe UI', 'Cairo', 'Tahoma', 'Noto Naskh Arabic', sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#1E293B" opacity="1" dir="rtl" dominant-baseline="middle">LoRA: زيادة صغيرة فوق أوزان جامدة</text>
<rect x="110" y="120" width="430" height="84" rx="14" ry="14" fill="#F8FAFC" stroke="#4F46E5" stroke-width="1.5" opacity="1"/>
