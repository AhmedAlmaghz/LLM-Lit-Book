<text x="520.0" y="522" font-family="'Segoe UI', 'Cairo', 'Tahoma', 'Noto Naskh Arabic', sans-serif" font-size="12.6" font-weight="400" text-anchor="middle" fill="#64748B" opacity="1" dir="rtl" dominant-baseline="middle">الخطأ الشائع: فتح كل الطبقات على بيانات صغيرة (overfit) — بقّص الهدف إلى 30% من الطبقات أولًا</text>
