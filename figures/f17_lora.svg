<line x1="268" y1="296" x2="306" y2="296" stroke="#059669" stroke-width="1.6" marker-end="url(#agrA)" opacity="1"/>
<rect x="310" y="276" width="118" height="40" rx="8" ry="8" fill="white" stroke="#059669" stroke-width="1.4" opacity="1"/>
